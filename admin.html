<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitabora — Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><a class="brand" href="index.html"><span>KB</span> Kitabora Admin</a><a href="index.html">Mağazaya bax →</a></header>
<main class="section"><p class="eyebrow">İDARƏETMƏ PANELİ</p><h1 style="font:600 48px 'Playfair Display',serif;margin-top:0">Mağaza idarəetməsi</h1>
<div class="admin-grid"><div class="admin-card"><h2>Kitab əlavə et</h2><form id="bookForm"><input required id="title" placeholder="Kitab adı"><input required id="author" placeholder="Müəllif"><select id="cat"><option>Roman</option><option>Psixologiya</option><option>Biznes</option><option>Uşaq</option><option>Tarix</option><option>Fantastika</option></select><input required id="price" type="number" step=".01" placeholder="Qiymət (₼)"><input id="tag" placeholder="Etiket (məs. Yeni)"><button class="primary">Kitabı əlavə et</button></form></div>
<div class="admin-card"><h2>Sifarişlər</h2><div id="orders"></div></div></div></main>
<script>
const orders=JSON.parse(localStorage.getItem("kitabora-orders")||"[]");const o=document.querySelector("#orders");
o.innerHTML=orders.length?orders.reverse().map(x=>`<div style="padding:14px 0;border-bottom:1px solid #ddd7ca"><b>${x.id}</b><br>${x.customer.name} · ${x.customer.phone}<br>${x.customer.city}, ${x.customer.address}<br><small>${new Date(x.date).toLocaleString("az-AZ")}</small></div>`).join(""):"Hələ sifariş yoxdur.";
document.querySelector("#bookForm").onsubmit=e=>{e.preventDefault();let custom=JSON.parse(localStorage.getItem("kitabora-custom-books")||"[]");custom.push({id:Date.now(),title:title.value,author:author.value,cat:cat.value,price:+price.value,tag:tag.value});localStorage.setItem("kitabora-custom-books",JSON.stringify(custom));alert("Kitab yadda saxlanıldı. Demo versiyada məhsul məlumatı localStorage-da saxlanılır.");e.target.reset()};
</script><style>.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.admin-card{background:#fbfaf6;padding:28px;border:1px solid #ddd7ca}.admin-card h2{font:600 28px "Playfair Display",serif}.admin-card form{display:grid;gap:12px}.admin-card input,.admin-card select{padding:13px;border:1px solid #ddd7ca}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}}</style>
</body></html>
